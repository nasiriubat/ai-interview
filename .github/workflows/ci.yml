name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_discovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    # DATABASE_URL is set for the whole job and AIDP_ALLOW_SKIP_DB never is: `pnpm check` fails when
    # the database is missing and fails when any test was skipped, so a misconfigured job goes red
    # instead of green with the integration suites quietly absent.
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/ai_discovery
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aidp/db prisma:generate
      - run: pnpm --filter @aidp/db exec prisma migrate deploy
      # The gate must be able to say no. Without a database `pnpm check` has to refuse at once; if
      # it ever passes here the "zero skipped" guarantee below means nothing.
      - name: The gate refuses to run without a database
        run: |
          if env -u DATABASE_URL pnpm check; then
            echo "pnpm check passed without DATABASE_URL: the gate is not honest" >&2
            exit 1
          fi
      # format, build, typecheck, lint, then every package's tests, all against the database above.
      - run: pnpm check

  # Spec 11: dependency scanning in CI. Its own job so a new advisory (which arrives without any
  # code change) is a clearly labelled red mark rather than a reason the test job looks broken.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any high or critical advisory in what ships. The gate adds expiring, justified
      # exceptions (audit-ignore.json) for the case where no fixed version exists yet.
      - run: pnpm audit --prod --audit-level=high || node scripts/audit-gate.mjs
      - run: node --test scripts/audit-gate.test.mjs

  # The reverse proxy's configuration is where body limits and the client-address header live
  # (S1, S6); a typo there is otherwise found by the first deploy.
  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -e ACME_EMAIL=ops@example.test -e PUBLIC_HOSTNAME=example.test -e CADDY_LOCAL_CERTS=local_certs
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
