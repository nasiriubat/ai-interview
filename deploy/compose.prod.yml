# Production stack for a single EU VPS. Read docs/DEPLOY.md before running this.
#
#   deploy/upgrade.sh          # build, back up, migrate, switch, check (the first deploy too)
#   deploy/dc ps               # `docker compose` with this file, deploy/.env and deploy/versions.env
#
# Run through those two and never `docker compose up` by hand: they supply deploy/versions.env,
# which names the image tag (the git SHA the images were built from), and upgrade.sh takes the
# backup and runs the post-switch checks that a bare `up` skips.
#
# This is a separate file, not an overlay on docker-compose.yml, because the two differ by
# subtraction as much as by addition: development publishes Postgres on 5432 and runs Mailpit,
# and a compose overlay can neither unpublish a port nor remove a service. Keeping them apart
# means the production file can be read top to bottom and believed.
#
# Nothing here reads apps/api/.env. Every value is named explicitly and comes from the
# --env-file, so a variable that is missing stops the stack instead of silently defaulting.

# Pinned, so the volume names (aidp_pgdata ...) do not depend on the name of the directory the
# repository happens to be cloned into. An install made before this line existed has volumes called
# deploy_pgdata; it sets COMPOSE_PROJECT_NAME=deploy in deploy/.env (generate-env.sh does not, and
# upgrade.sh refuses to continue if it finds those volumes without it). See D-96.
name: aidp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# One server image for migrate, api and worker (D-74). Only `migrate` builds it; the other two
# reuse it by name, so `build` produces one image rather than three identical copies. The tag is
# the git SHA (D-96): a rollback is `up` with the previous tag, and needs no build.
x-app-image: &app-image
  image: "aidp-server:${AIDP_VERSION:?AIDP_VERSION is not set, run deploy/upgrade.sh or use deploy/dc}"
  pull_policy: never

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # No `ports:`. The database is reachable only from this compose network. If you need psql,
    # go through `docker compose exec postgres psql`, not through a hole in the firewall.
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ai_discovery
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_discovery"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  # One-shot. Runs as the owner role, which is the only role allowed to change the schema, and
  # hands bootstrap APP_DB_PASSWORD so it gives `app_api` a login (packages/db/seeds/bootstrap.ts).
  migrate:
    image: aidp-server:${AIDP_VERSION:?}
    pull_policy: never
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    healthcheck: { disable: true }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?}@postgres:5432/ai_discovery
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?set PLATFORM_ENCRYPTION_KEY in deploy/.env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env}
      BOOTSTRAP_OPERATOR_EMAIL: ${BOOTSTRAP_OPERATOR_EMAIL:?set BOOTSTRAP_OPERATOR_EMAIL in deploy/.env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in deploy/.env}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-First tenant}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The only one of the three that can transcribe, speak and embed, so it is what turns on
      # voice and semantic clustering. See docs/DEPLOY.md, "Model configuration".
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command:
      - sh
      - -c
      - pnpm --filter @aidp/db exec prisma migrate deploy && pnpm --filter @aidp/db bootstrap:prod
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  # One-shot. Repairs job-queue ownership after a restore; see deploy/grants.sql. Idempotent,
  # owner role, runs on every boot, no-op on a healthy system. The schema-level privileges this
  # used to carry are migration 0010_app_role_runtime_grants and no longer need a deployment step.
  db-grants:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGURL: postgresql://app:${POSTGRES_PASSWORD:?}@postgres:5432/ai_discovery
    volumes:
      - ./grants.sql:/grants.sql:ro
    entrypoint: ["sh", "-c", 'psql -v ON_ERROR_STOP=1 -f /grants.sql "$$PGURL"']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: *logging

  # One-shot gate. Connects exactly as the API will and refuses to let the stack start unless
  # row-level security is genuinely in force. See deploy/preflight.sh for what it asserts.
  preflight:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      APP_DATABASE_URL: postgresql://app_api:${APP_DB_PASSWORD:?}@postgres:5432/ai_discovery
      # A failure is also written here for ops-notify to deliver: when this gate refuses, the
      # application is not running and cannot tell anyone (D-94).
      OPS_STATE_DIR: /ops-state
    volumes:
      - ./preflight.sh:/usr/local/bin/preflight.sh:ro
      - ops_state:/ops-state
    entrypoint: ["/usr/local/bin/preflight.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      db-grants: { condition: service_completed_successfully }
      ops-state-init: { condition: service_completed_successfully }
    logging: *logging

  # One-shot. Creates the directories of the shared ops_state volume with the permissions its
  # writers need: preflight runs as the postgres user, the worker as uid 1000 and the backup as
  # root, and a named volume starts out root-owned, so nobody but root could create their own.
  # Sticky world-writable: anyone may write a file, only its owner (or root) may delete it.
  ops-state-init:
    image: aidp-ops-notify:${AIDP_VERSION:?}
    pull_policy: never
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /ops-state/alerts/sent /ops-state/status /ops-state/heartbeat /ops-state/watchdog
        chmod 1777 /ops-state /ops-state/alerts /ops-state/alerts/sent /ops-state/status /ops-state/heartbeat /ops-state/watchdog
    volumes:
      - ops_state:/ops-state
    logging: *logging

  api:
    <<: *app-image
    restart: unless-stopped
    # No `ports:`. Caddy reaches it over the compose network; the browser never does.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      # The role is written into the file, not passed in, so there is no variable an operator
      # can point back at the owner. Only the password comes from the environment.
      DATABASE_URL: postgresql://app_api:${APP_DB_PASSWORD:?}@postgres:5432/ai_discovery
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      WEB_ORIGIN: https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in deploy/.env}
      PUBLIC_WEB_URL: https://${PUBLIC_HOSTNAME:?}
      EMAIL_SMTP_URL: ${EMAIL_SMTP_URL:?set EMAIL_SMTP_URL in deploy/.env — sign-in does not work without an SMTP relay}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env}
      # Recorded audio and uploaded documents (FR-30, FR-31). Always set: with no directory the
      # store falls back to memory, which loses every upload on the next deploy and says nothing.
      UPLOAD_DIR: /uploads
      # Recorded answers are transcribed here by Whisper on this server (D-75). The model is
      # downloaded into the `models` volume on first use, about 250 MB, and kept across deploys.
      MODEL_CACHE_DIR: /models
      # Minutes the model stays in memory after the last recording (about 700 MB while loaded);
      # reloading from the volume takes about a second. 0 keeps it loaded.
      SPEECH_MODEL_IDLE_MINUTES: ${SPEECH_MODEL_IDLE_MINUTES:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Where operator alerts go before anyone has opened the settings screen (D-90); the catalog
      # keys ops.alertEmail and ops.alertWebhookUrl win when set. Empty falls back to the bootstrap
      # operator's address, and to no webhook.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-}
      # Outbound model-call limits (D-93). Empty means the built-in defaults: 120 s per call,
      # 20 s to the first token, 30 s of silence mid-stream, two retries.
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-}
      PROVIDER_FIRST_TOKEN_TIMEOUT_MS: ${PROVIDER_FIRST_TOKEN_TIMEOUT_MS:-}
      PROVIDER_IDLE_TIMEOUT_MS: ${PROVIDER_IDLE_TIMEOUT_MS:-}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-}
    volumes:
      - uploads:/uploads
      - models:/models
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      preflight: { condition: service_completed_successfully }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # whisper-small (8-bit) holds about 0.9 GB once loaded and peaks near 2 GB while it
          # transcribes, on top of the API itself. With OpenAI doing transcription 1024M is enough.
          memory: 2560M

  worker:
    <<: *app-image
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app_api:${APP_DB_PASSWORD:?}@postgres:5432/ai_discovery
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      WEB_ORIGIN: https://${PUBLIC_HOSTNAME:?}
      PUBLIC_WEB_URL: https://${PUBLIC_HOSTNAME:?}
      EMAIL_SMTP_URL: ${EMAIL_SMTP_URL:?set EMAIL_SMTP_URL in deploy/.env — sign-in does not work without an SMTP relay}
      EMAIL_FROM: ${EMAIL_FROM:?}
      # The same volume the API writes to: the API stores the upload, the worker reads it back to
      # extract, transcribe and chunk it. Two containers, one directory, one copy of the bytes.
      UPLOAD_DIR: /uploads
      # No OTEL_EXPORTER_OTLP_ENDPOINT: the worker does not read it, and passing a variable
      # nothing reads is how a setting appears to work and does not. Worker tracing is planned.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-}
      PROVIDER_FIRST_TOKEN_TIMEOUT_MS: ${PROVIDER_FIRST_TOKEN_TIMEOUT_MS:-}
      PROVIDER_IDLE_TIMEOUT_MS: ${PROVIDER_IDLE_TIMEOUT_MS:-}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-}
      # The shared status volume: the worker writes heartbeat/worker here and reads the backup's
      # status/backup.json for its health sweep (D-92).
      OPS_STATE_DIR: /ops-state
    volumes:
      - uploads:/uploads
      - ops_state:/ops-state
    # The worker has no HTTP surface. It used to be `kill -0 1`, which is true of a worker that has
    # lost its database and is doing nothing. The heartbeat file is refreshed only while pg-boss
    # answers (apps/worker/src/heartbeat.ts), so a stale file is a worker that cannot work. The
    # worker also exits for restart after three misses: Docker never restarts an unhealthy
    # container by itself, so the exit is what turns this check into a repair. Written in node:
    # the slim image carries no tooling worth depending on, and node is the one thing certain to
    # be there.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - process.exit(Date.now()-require('fs').statSync('/ops-state/heartbeat/worker').mtimeMs<90000?0:1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      preflight: { condition: service_completed_successfully }
      ops-state-init: { condition: service_completed_successfully }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  web:
    image: aidp-web:${AIDP_VERSION:?}
    pull_policy: never
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # No `ports:`. Caddy is the only thing that talks to it.
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      AUTH_URL: https://${PUBLIC_HOSTNAME:?}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?}
      EMAIL_SERVER: ${EMAIL_SMTP_URL:?set EMAIL_SMTP_URL in deploy/.env — sign-in does not work without an SMTP relay}
      EMAIL_FROM: ${EMAIL_FROM:?}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api: { condition: service_healthy }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service on this host that publishes anything.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    # The Caddyfile substitutes CADDY_LOCAL_CERTS straight into its global options block, where the
    # only value Caddy accepts is the literal directive `local_certs`. Setting it to `1`, which is
    # what anyone would try, makes Caddy reject its own config and restart forever with
    # "unrecognized global option: 1" — a message that names neither the variable nor the file the
    # operator edited. This normalizes the obvious spellings and refuses the rest by name.
    entrypoint:
      - sh
      - -c
      - |
        case "$${CADDY_LOCAL_CERTS:-}" in
          ''|0|false|no|off) CADDY_LOCAL_CERTS='' ;;
          1|true|yes|on|local_certs) CADDY_LOCAL_CERTS='local_certs' ;;
          *) echo "caddy: CADDY_LOCAL_CERTS in deploy/.env is '$$CADDY_LOCAL_CERTS'." >&2
             echo "Leave it empty for a real certificate from Let's Encrypt, or set it to 1 to use" >&2
             echo "Caddy's own CA when testing without a public domain. See docs/DEPLOY.md." >&2
             exit 1 ;;
        esac
        export CADDY_LOCAL_CERTS
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # The maintenance flag: while /maintenance/on exists Caddy answers 503 with a page instead of
      # a proxy error. upgrade.sh creates it before the switch and removes it after the checks
      # pass (D-96). Mounted read-write only so that `exec` into this container can toggle it.
      - caddy_maint:/maintenance
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2020/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      web: { condition: service_healthy }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Nightly encrypted backup into the `backups` volume, verified, reported in
  # /ops-state/status/backup.json, and copied offsite when RCLONE_REMOTE is set (D-95). Its own
  # image (deploy/backup.Dockerfile): the server's Postgres major, so pg_dump matches, plus age,
  # rclone and jq. It is unhealthy when the LAST BACKUP failed or is old, not merely when the
  # loop has stopped (deploy/backup-health.sh).
  backup:
    image: aidp-backup:${AIDP_VERSION:?}
    pull_policy: never
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    environment:
      PGURL: postgresql://app:${POSTGRES_PASSWORD:?}@postgres:5432/ai_discovery
      BACKUP_AT: ${BACKUP_AT:-03:20}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: /backups
      # Read-only, and read for a reason: a database-only backup restores Attachment rows whose
      # bytes are gone, and nothing says so until somebody presses play.
      UPLOAD_DIR: /uploads
      # Written by deploy/ensure-backup-key.sh. There is no unencrypted mode: a backup that leaves
      # this host in the clear is the thing the offsite copy would otherwise be.
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?no backup encryption key, run deploy/upgrade.sh or deploy/ensure-backup-key.sh}"
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      OPS_STATE_DIR: /ops-state
      # Offsite copy. Unset means "not configured", which /operator and OPERATIONS.md call out as
      # an accepted risk, not a silent one. rclone reads the remote's settings from RCLONE_CONFIG_*.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${RCLONE_CONFIG_OFFSITE_ACCOUNT:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${RCLONE_CONFIG_OFFSITE_KEY:-}
    volumes:
      - backups:/backups
      - uploads:/uploads:ro
      - ops_state:/ops-state
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      ops-state-init: { condition: service_completed_successfully }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # The alerting path that does not need the application (D-94): delivers the alert files shell
  # producers drop in /ops-state/alerts (the RLS preflight, a failed offsite copy), and watches
  # what the application cannot watch about itself: the worker's heartbeat, the API's readiness,
  # the certificate, and, while the worker is down, the backup and the disk. Posts to
  # ALERT_WEBHOOK_URL and mails ALERT_EMAIL through EMAIL_SMTP_URL, from its own image
  # (deploy/ops-notify.Dockerfile) so that it shares nothing with what is broken.
  ops-notify:
    image: aidp-ops-notify:${AIDP_VERSION:?}
    pull_policy: never
    build:
      context: .
      dockerfile: ops-notify.Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      BOOTSTRAP_OPERATOR_EMAIL: ${BOOTSTRAP_OPERATOR_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-ntfy}
      EMAIL_SMTP_URL: ${EMAIL_SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      API_READY_URL: http://api:4000/api/v1/health/ready
      TLS_CONNECT: caddy:443
      DISK_PATH: /watch/uploads
      OPS_STATE_DIR: /ops-state
    volumes:
      - ops_state:/ops-state
      # Only to read the size of the filesystem it is on: the uploads, the database and the
      # backups all share the host's one disk.
      - uploads:/watch/uploads:ro
    healthcheck:
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(cat /ops-state/watchdog/alive 2>/dev/null || echo 0) )) -lt 180
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      ops-state-init: { condition: service_completed_successfully }
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 32M

volumes:
  pgdata:
  uploads:
  models:
  backups:
  caddy_data:
  caddy_config:
  caddy_maint:
  # Shared status and alert files between the containers that cannot talk to each other (D-92):
  # heartbeat/worker, status/backup.json, alerts/*.json, watchdog/ state.
  ops_state:
