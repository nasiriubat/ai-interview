# CHAOS ONLY (deploy/chaos/disk-full.mjs): the backups volume becomes a 100 KB tmpfs, so the dump has
# nowhere to go. A new volume name: the real `backups` volume and the dumps in it are untouched.
volumes:
  backups:
    name: ${COMPOSE_PROJECT_NAME:-aidpfull}_backups_small
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=100k,mode=0777"
