# The optional observability stack (D-222): Prometheus and Grafana, with Tempo behind a second
# profile. Layered onto the production stack, never part of it:
#
#   deploy/dc -f deploy/observability/compose.yml --profile observability up -d
#   deploy/dc -f deploy/observability/compose.yml --profile observability --profile traces up -d
#
# (`deploy/dc` is `docker compose -f deploy/compose.yml --env-file ...`; the extra -f joins
# this file to the same project and network, so `api:9464` and `worker:9465` resolve.)
#
# Sized for the 4 GB host the pilot runs on. The limits below add 416 MB for the metrics profile
# (Prometheus 192M, Grafana 224M); the stack's own limits are 3232 MB (docs/DEPLOY.md, sizing),
# which leaves about 450 MB for the OS. Tempo adds 192 MB and does not fit that arithmetic: use the
# `traces` profile on the 8 GB preset, or point the stack's OTEL_EXPORTER_OTLP_ENDPOINT at a hosted
# OTLP receiver (Grafana Cloud's free tier takes it as it is) and leave Tempo off.
#
# Why these three and not something lighter: Prometheus is the smallest thing that can draw a p95
# from a histogram, and the application already exposes the text format it scrapes (no collector in
# between); Grafana is the viewer that reads both; Tempo is the single-binary OTLP trace store with
# a local backend, the lightest that Grafana can follow a trace id into. Jaeger all-in-one is
# comparable in size but has no Grafana trace-to-metrics link and a second UI to learn.
#
# Nothing here is reachable from the internet. Grafana binds the loopback of the host:
#   ssh -L 3001:localhost:3001 you@your-vps     then     http://localhost:3001
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Fifteen days or a gigabyte, whichever comes first: the disk is shared with the database
      # and the backups, and a metrics store that fills it is the outage it was meant to show.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle=false
    volumes:
      # Relative to deploy/, the project directory (the first -f file's), not to this file.
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    # Not published: Grafana reaches it over the network, and an operator through Grafana.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  grafana:
    image: grafana/grafana-oss:11.3.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env before starting the observability profile}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: ""
      # Grafana is a Go program: a soft memory limit below the container limit makes the runtime
      # collect before the kernel kills it.
      GOMEMLIMIT: 180MiB
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 224M

  # Traces. Off unless the `traces` profile is named, and then the stack's OTEL_EXPORTER_OTLP_ENDPOINT
  # is http://tempo:4318 (set it in .env).
  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["traces"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
