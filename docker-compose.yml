# The whole platform on one machine, for development: Postgres is published on 5432, a mail
# catcher stands in for a relay, and there is no TLS. Do not point a domain at this.
#
# Production is a separate file, deploy/compose.prod.yml, with the runbook in docs/DEPLOY.md.
#
#   docker compose up -d --build          # postgres, mail catcher, migrations + bootstrap, api, worker, web
#   docker compose --profile extras up -d # adds MinIO (object storage) and Kroki (diagram rendering)
#
# Secrets and bootstrap identities come from apps/api/.env (copy apps/api/.env.example).
# Emails (magic links, invitations, verification codes) are caught by Mailpit: http://localhost:8025
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_discovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_discovery"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: api }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
    command: >
      sh -c "pnpm --filter @aidp/db exec prisma migrate deploy && pnpm --filter @aidp/db bootstrap"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: api }
    env_file: apps/api/.env
    environment:
      UPLOAD_DIR: /uploads
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
      HOST: 0.0.0.0
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      EMAIL_SMTP_URL: smtp://mailpit:1025
    ports:
      - "4000:4000"
    volumes:
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: worker }
    env_file: apps/api/.env
    environment:
      UPLOAD_DIR: /uploads
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
      EMAIL_SMTP_URL: smtp://mailpit:1025
    volumes:
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: apps/api/.env # AUTH_SECRET is shared with the API
    environment:
      API_URL: http://api:4000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      EMAIL_SERVER: smtp://mailpit:1025
      EMAIL_FROM: no-reply@example.com
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }

  minio:
    profiles: ["extras"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  kroki:
    profiles: ["extras"]
    image: yuzutech/kroki:latest
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
  minio:
