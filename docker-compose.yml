# The whole platform on one machine, for development: Postgres is published on 5432, a mail
# catcher stands in for a relay, and there is no TLS. Do not point a domain at this.
#
# Production is a separate file, deploy/compose.prod.yml, with the runbook in docs/DEPLOY.md.
#
#   pnpm stack:up        # build and start: postgres, mail catcher, migrations + bootstrap, api, worker, web
#   pnpm stack:down      # stop, keeping the database
#   pnpm stack:clean     # stop and remove this project's images and dangling build layers
#   docker compose --profile extras up -d # adds MinIO (object storage) and Kroki with its Mermaid companion (diagram rendering)
#
# Two images are built, not four: `aidp-server` (migrate, api and worker run it with different
# commands) and `aidp-web`. See docs/discovery/decisions.md D-74.
#
# Secrets and bootstrap identities come from the root .env (copy .env.example). Every service reads
# it through the `x-env-files` anchor below, and compose uses the same file for ${VARIABLE} substitution.
# apps/api/.env is legacy: if it still exists it is read underneath the root file (root wins) so an
# install that has not run `pnpm env:migrate` keeps working; `pnpm stack:up` warns about it.
# Emails (magic links, invitations, verification codes) are caught by Mailpit: http://localhost:8025
# Logs rotate at 10 MB x 3 per container, as in production. Without this a development stack that
# stays up for weeks keeps every health-check line it ever wrote.
x-env-files: &env-files
  - path: apps/api/.env # legacy, optional; later files win
    required: false
  - path: .env
    required: false

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *logging
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_discovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_discovery"]
      interval: 5s
      retries: 20

  mailpit:
    <<: *logging
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # The one service that builds the server image; api and worker reuse it by name.
  migrate:
    <<: *logging
    image: aidp-server:latest
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: *env-files
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
    command: >
      sh -c "pnpm --filter @aidp/db exec prisma migrate deploy && pnpm --filter @aidp/db bootstrap:prod"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *logging
    image: aidp-server:latest
    pull_policy: never
    stop_grace_period: 40s
    env_file: *env-files
    environment:
      UPLOAD_DIR: /uploads
      # Recorded answers are transcribed here, by Whisper on this machine (D-75); the model is
      # downloaded into this volume on first use and kept across rebuilds.
      MODEL_CACHE_DIR: /models
      SPEECH_MODEL_IDLE_MINUTES: ${SPEECH_MODEL_IDLE_MINUTES:-10}
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
      HOST: 0.0.0.0
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      EMAIL_SMTP_URL: smtp://mailpit:1025
      # Platform providers may reach these local services; a tenant never can (D-83).
      EGRESS_ALLOW_HOSTS: kroki,minio,mailpit,host.docker.internal
      # Present only with `--profile extras`; without it a diagram is printed as source.
      KROKI_URL: http://kroki:8000
    ports:
      - "4000:4000"
    volumes:
      - uploads:/uploads
      - models:/models
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  worker:
    <<: *logging
    image: aidp-server:latest
    pull_policy: never
    command: ["node", "apps/worker/dist/main.js"]
    healthcheck: { disable: true }
    stop_grace_period: 40s
    env_file: *env-files
    environment:
      UPLOAD_DIR: /uploads
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
      EMAIL_SMTP_URL: smtp://mailpit:1025
      EGRESS_ALLOW_HOSTS: kroki,minio,mailpit,host.docker.internal
    volumes:
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    <<: *logging
    image: aidp-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Development runs the web app on 3000 and the API on 4000, so the browser cannot reach
        # the voice socket on its own origin. In production Caddy puts both behind one hostname
        # and this is left empty.
        NEXT_PUBLIC_VOICE_WS_URL: ws://localhost:4000/api/v1/p/session/live
    env_file: *env-files # AUTH_SECRET is shared with the API
    environment:
      API_URL: http://api:4000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      EMAIL_SERVER: smtp://mailpit:1025
      EMAIL_FROM: no-reply@example.com
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }

  minio:
    <<: *logging
    profiles: ["extras"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  # Diagram rendering for PDF export and the diagram editor (D-210). The core image cannot draw
  # Mermaid by itself: it hands those requests to the companion below (a headless Chromium) through
  # KROKI_MERMAID_HOST. Without the `extras` profile the API has no renderer, and says so: diagrams
  # are printed as their source and saved unverified.
  kroki:
    <<: *logging
    profiles: ["extras"]
    image: yuzutech/kroki:0.26.0
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
      KROKI_MAX_BODY_SIZE: "65536"
      JAVA_OPTS: "-Xms64m -Xmx192m"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      kroki-mermaid: { condition: service_healthy }

  kroki-mermaid:
    <<: *logging
    profiles: ["extras"]
    image: yuzutech/kroki-mermaid:0.26.0
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:
  models:
  minio:
