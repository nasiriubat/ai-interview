# Local development infrastructure. The apps run on the host with `pnpm dev`;
# `docker compose --profile full up` runs the API and worker in containers too.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_discovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  kroki:
    image: yuzutech/kroki:latest
    ports:
      - "8000:8000"

  api:
    profiles: ["full"]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: api }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    profiles: ["full"]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: worker }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ai_discovery
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  minio:
