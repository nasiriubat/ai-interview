# Secret scanning over the full history (spec 11, D-267). CI runs
#   gitleaks detect --config .gitleaks.toml --log-opts="--all"
# so what the default ruleset finds and this file does not excuse fails the build.
title = "ai-discovery-platform"

[extend]
useDefault = true

# Test files carry obviously fake credentials (`test-secret-test-secret...`, `GOOD_KEY = "sk-..."`)
# so a suite can prove that a secret is redacted, refused or encrypted. The eleven findings in the
# history at the time of writing are all of that kind, in test directories. The excuse is the
# directory, for every rule: it is deliberately not widened to `src/`, scripts, deploy or docs,
# where a hit is a real finding. The price is that a real key committed under `test/` would pass,
# which is why the review rule is "no real credential in a fixture, ever".
[allowlist]
description = "fake credentials in test fixtures"
paths = ['''(^|/)(test|tests|e2e)/''']
